<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Echo Chamber</title>
    <link rel="icon" type="image/png" href="assets/echoChamberLogo.png">
    <link rel="stylesheet" href="assets/vendor/uplot/uPlot.min.css">
    <script src="assets/vendor/uplot/uPlot.iife.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 1rem;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .brand {
            display: block;
            width: 220px;
            height: auto;
            overflow: hidden;
            flex-grow: 3;
            padding: 1rem;
        }

        .brand-logo {
            display: block;
            width: auto;
            height: 10dvh;
            object-fit: contain;
        }


        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .status-badge.disconnected {
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .status-badge.connected {
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .dashboard {
            display: flex;
            gap: 1rem;
            flex: 1;
            overflow: hidden;
        }

        .controls {
            width: 250px;
            background: var(--surface);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .chartsarea {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow: hidden;
            background: var(--surface);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .chart-box {
            flex: 1;
            position: relative;
            min-height: 50px;
            width: 100%;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .controls-group label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        select, input[type="range"], input[type="text"] {
            width: 100%;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 0.55rem;
            border-radius: 6px;
            font-family: inherit;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        .filename-hint {
            color: #64748b;
            font-size: 10px;
            line-height: 1.35;
        }

        select {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            color-scheme: dark;
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Chromium on Windows may otherwise use white native-menu colours. */
        select option {
            background-color: #111827;
            color: #f8fafc;
        }

        select option:checked,
        select option:hover {
            background-color: #1d4ed8;
            color: #ffffff;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.1s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .stop-button {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.55);
            color: #fca5a5;
            text-align: center;
        }

        .stop-button:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.24);
        }

        button.active.mode-ctrl {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent);
            color: #93c5fd;
        }

        button.active.mode-loop {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: #fca5a5;
        }

        button.active.rec-on {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            color: #6ee7b7;
        }

        button.active.arm-on {
            background: rgba(239, 68, 68, 0.25);
            border-color: var(--danger);
            color: #fecaca;
        }

        .fault-panel {
            display: none;
            padding: 0.65rem;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.55);
            color: #fecaca;
            font-size: 11px;
            line-height: 1.4;
        }

        @media (max-width: 800px) {
            body { height: auto; max-height: none; overflow: auto; }
            .dashboard { flex-direction: column; overflow: visible; }
            .controls { width: 100%; max-height: none; }
            .chartsarea { min-height: 70vh; }
            .brand-logo { max-width: 70vw; height: auto; max-height: 72px; }
        }

        /* uPlot overrides for dark mode */
        .u-title {
            color: #f8fafc;
            font-weight: 600;
            font-family: Inter, sans-serif;
            font-size: 12px;
            margin: 0;
            padding: 2px;
        }

        .u-axis-text {
            fill: #94a3b8;
            font-family: Inter, sans-serif;
            font-size: 10px;
        }

        .u-legend {
            color: #f8fafc;
            font-size: 12px;
            padding: 2px;
            display: none;
        }

        .u-wrap {
            padding-top: 0 !important;
        }
    </style>
</head>

<body>

    <div class="header">
        <img class="brand-logo" src="assets/echoChamberLogo.png" alt="The Echo Chamber">
        <span id="status" class="status-badge disconnected">Disconnected</span>
    </div>

    <div class="dashboard">
        <div class="controls">
            <div class="controls-group">
                <label>Acquisition</label>
                <button id="btn-acq" onclick="toggleAcquisition()">Start Acquisition</button>
                <div id="fault-panel" class="fault-panel"></div>
            </div>

            <div class="controls-group">
                <label>Recording</label>
                <input id="recording-filename" type="text" maxlength="80"
                       autocomplete="off" spellcheck="false" placeholder="Optional filename">
                <div class="filename-hint">Saved as YYYYMMDD_HHMMSS_NAME.h5</div>
                <button id="btn-rec" onclick="toggleRecording()">Start Recording</button>
            </div>

            <div class="controls-group">
                <label>Experiment Mode</label>
                <button id="btn-ctrl" class="active mode-ctrl" onclick="setMode('control')">Control</button>
                <button id="btn-loop" onclick="setMode('closed-loop')">Closed-Loop</button>
            </div>

            <div class="controls-group">
                <label>Cortex input</label>
                <select id="cortex-channel" onchange="setCortexChannel()">
                    <option value="ai0">AI0</option>
                    <option value="ai1" selected>AI1</option>
                </select>
            </div>

            <div class="controls-group">
                <label>Stimulation (Closed-Loop)</label>
                <select id="stim-mode" onchange="setStim()">
                    <option value="off">Off</option>
                    <option value="passthrough">ESN Passthrough</option>
                    <option value="threshold_pulse">ESN Threshold Pulse</option>
                </select>
                <div style="font-size: 11px; color: #64748b; margin-top: 0.4rem;">
                Stim gain
            </div>
                <div style="display:flex; gap: 0.5rem; align-items:center;">
                    <input id="stim-gain" type="range" min="0" max="10" step="0.001" value="0" oninput="setStim(true)" onchange="setStim(false)" />
                    <div style="width: 64px; text-align:right; font-size: 12px;" id="stim-gain-label">×0.000</div>
                </div>
                <div style="font-size: 11px; color: #64748b; margin-top: 0.4rem;">
                Noise threshold for pulse generation
            </div>
                <div style="display:flex; gap: 0.5rem; align-items:center;">
                    <input id="pulse-threshold" type="range" min="0.1" max="10" step="0.1" value="3.0" oninput="setPulseThreshold()" />
                    <div style="width: 64px; text-align:right; font-size: 12px;" id="pulse-threshold-label">3.0 SD</div>
                </div>
                <div style="font-size: 11px; color: #64748b; margin-top: 0.4rem;">
                Noise calculation window
            </div>
                <div style="display:flex; gap: 0.5rem; align-items:center;">
                    <input id="pulse-window" type="range" min="1" max="60" step="1" value="10" oninput="setPulseWindow()" />
                    <div style="width: 64px; text-align:right; font-size: 12px;" id="pulse-window-label">10 s</div>
                </div>
                <div style="font-size: 11px; color: #64748b; margin-top: 0.4rem;">Pulse polarity</div>
                <select id="pulse-polarity" onchange="setPulsePolarity()">
                    <option value="absolute" selected>Absolute (±)</option>
                    <option value="positive">Positive</option>
                    <option value="negative">Negative</option>
                </select>
                <button id="btn-arm" onclick="toggleArmed()">Arm Output</button>
                <div class="filename-hint">Closed-loop computation does not energize AO until output is armed.</div>
            </div>

            
            <div style="font-size: 11px; color: #64748b; line-height: 1.5;" id="fs-info">
                Waiting for stream info...
            </div>
            <div style="font-size: 11px; color: #64748b; line-height: 1.5;" id="calibration-info">
                Waiting for calibration profile...
            </div>

            <button id="btn-stop-app" class="stop-button" onclick="stopApplication()">Stop Application</button>
        </div>

        <div class="chartsarea">
            <div id="chart-ai0" class="chart-box"></div>
            <div id="chart-ai1" class="chart-box"></div>
            <div id="chart-ao0" class="chart-box"></div>
        </div>
    </div>

    <script>
        // --- UPLOT SETUP (3 Stacked Charts) ---
        let uplotAi0, uplotAi1, uplotAo0;

        function makeOpts(title, strokeColor) {
            return {
                title: title,
                width: 100, // Wait for resize
                height: 100, // Wait for resize
                cursor: { sync: { key: "foo" } },
                scales: { x: { time: false } },
                series: [
                    {},
                    { stroke: strokeColor, width: 2 }
                ],
                axes: [
                    {
                        stroke: "#94a3b8",
                        grid: { stroke: "rgba(255,255,255,0.05)", width: 1 }
                    },
                    { stroke: "#94a3b8", grid: { stroke: "rgba(255,255,255,0.05)", width: 1 } }
                ]
            };
        }

        uplotAi0 = new uPlot(makeOpts("CA3 (AI0, mV)", "#3b82f6"), [[], []], document.getElementById("chart-ai0"));
        uplotAi1 = new uPlot(makeOpts("Cortex (AI1, mV)", "#10b981"), [[], []], document.getElementById("chart-ai1"));
        function makeAoOpts() {
            const opts = makeOpts("Stimulation (AO0, V)", "#ef4444");
            opts.series = [
                {},
                { label: "Passthrough preview", stroke: "rgba(148, 163, 184, 0.8)", width: 1 },
                { label: "Pulse threshold", stroke: "rgba(203, 213, 225, 0.9)", width: 1, dash: [6, 4] },
                { label: "AO command", stroke: "#ef4444", width: 2 },
            ];
            return opts;
        }

        uplotAo0 = new uPlot(makeAoOpts(), [[], [], [], []], document.getElementById("chart-ao0"));

        function resizeCharts() {
            let boxes = [
                document.getElementById("chart-ai0"),
                document.getElementById("chart-ai1"),
                document.getElementById("chart-ao0")
            ];

            [uplotAi0, uplotAi1, uplotAo0].forEach((u, i) => {
                let box = boxes[i];
                u.setSize({
                    width: box.clientWidth,
                    height: box.clientHeight
                });
            });
        }

        window.addEventListener("resize", resizeCharts);
        // Initial setup resize
        setTimeout(resizeCharts, 50);

        // --- DATA STATE ---
        const MAX_SECONDS = 5;
        let downsampledFS = 2000;

        let tArray = [];
        let ai0Array = [];
        let ai1Array = [];
        let ao0Array = [];
        let previewArray = [];
        let thresholdArray = [];

        // UI STATE
        let isRecording = false;
        let currentMode = 'control';
        let stimMode = 'off';
        let stimGain = 0.0;
        let pulseThresholdStd = 3.0;
        let pulseWindowSec = 10.0;
        let pulsePolarity = 'absolute';
        let cortexAi = 'ai1';
        let isAcquiring = false;
        let isArmed = false;
        let currentFault = null;
        let shutdownRequested = false;
        let stimSendTimer = null;

        // --- WEBSOCKETS ---
        let ws;

        function connect() {
            const query = new URLSearchParams(window.location.search);
            const host = query.get('wsHost') || window.location.hostname || '127.0.0.1';
            const port = query.get('wsPort') || '8765';
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${protocol}://${host}:${port}`);

            ws.onopen = () => {
                let badge = document.getElementById("status");
                badge.textContent = "CONNECTED";
                badge.className = "status-badge connected";
                resizeCharts();
            };

            ws.onclose = () => {
                let badge = document.getElementById("status");
                if (shutdownRequested) {
                    badge.textContent = "STOPPED";
                    badge.className = "status-badge disconnected";
                    const button = document.getElementById("btn-stop-app");
                    button.textContent = "Stopped";
                    // The server is deliberately gone, so leaving this
                    // disabled avoids presenting a control that cannot act.
                    button.disabled = true;
                    return;
                }
                badge.textContent = "DISCONNECTED";
                badge.className = "status-badge disconnected";
                setTimeout(connect, 2000); // Reconnect loop
            };

            ws.onmessage = (e) => {
                try {
                    let msg = JSON.parse(e.data);

                    if (msg.type === "command_result") {
                        if (!msg.ok) {
                            console.error("Command rejected:", msg.error);
                            if (msg.command === "start_recording") {
                                isRecording = false;
                                updateButtonsVisually();
                            }
                            window.alert(msg.error);
                        }
                        return;
                    }

                    // Sync visually to backend truth
                    if (typeof msg.is_recording === "boolean") isRecording = msg.is_recording;
                    if (typeof msg.is_acquiring === "boolean") isAcquiring = msg.is_acquiring;
                    if (msg.mode) currentMode = msg.mode;
                    if (msg.stim_mode) stimMode = msg.stim_mode;
                    if (typeof msg.stim_gain === "number") stimGain = msg.stim_gain;
                    if (typeof msg.pulse_threshold_std === "number") pulseThresholdStd = msg.pulse_threshold_std;
                    if (typeof msg.pulse_window_sec === "number") pulseWindowSec = msg.pulse_window_sec;
                    if (msg.pulse_polarity) pulsePolarity = msg.pulse_polarity;
                    if (typeof msg.armed === "boolean") isArmed = msg.armed;
                    currentFault = msg.fault || null;
                    if (msg.cortex_ai === "ai0" || msg.cortex_ai === "ai1") cortexAi = msg.cortex_ai;
                    if (Array.isArray(msg.channels) && msg.channels.length === 2) {
                        const aiUnit = msg.ai_unit || "mV";
                        uplotAi0.root.querySelector('.u-title').textContent = `${msg.channels[0]} (AI0) — ${aiUnit}`;
                        uplotAi1.root.querySelector('.u-title').textContent = `${msg.channels[1]} (AI1) — ${aiUnit}`;
                    }
                    updateButtonsVisually();

                    if (msg.fs) {
                        downsampledFS = msg.fs;
                        document.getElementById("fs-info").innerHTML = `<strong>Data Stream FS:</strong> ${msg.fs} Hz`;
                    }
                    if (Array.isArray(msg.amplifier_gain) && typeof msg.ao_command_gain_v_per_esn_unit === "number") {
                        document.getElementById("calibration-info").innerHTML =
                            `<strong>Calibration:</strong> AI gains ${msg.amplifier_gain.join(' / ')}; AO ${msg.ao_command_gain_v_per_esn_unit} V per ESN unit`;
                    }

                    let ai0 = (msg.ai || [[], []])[0] || [];
                    let ai1 = (msg.ai || [[], []])[1] || [];
                    let ao0 = (msg.ao || [[]])[0] || [];
                    let preview = (msg.passthrough_preview || [[]])[0];
                    let threshold = (msg.pulse_threshold_preview || [[]])[0];
                    let numPoints = ai0.length;
                    if (!numPoints) return;
                    let sampleIds = msg.sample_indices || [];
                    let rawFs = msg.sample_rate_hz || (downsampledFS * 2);

                    for (let i = 0; i < numPoints; i++) {
                        const fallback = tArray.length ? (tArray[tArray.length - 1] + 1 / downsampledFS) : 0;
                        tArray.push(sampleIds.length === numPoints ? sampleIds[i] / rawFs : fallback);
                        ai0Array.push(ai0[i]);
                        ai1Array.push(ai1[i]);
                        ao0Array.push(ao0[i]);
                        previewArray.push(preview[i] ?? null);
                        thresholdArray.push(threshold[i] ?? null);
                    }
                    // Enforce max window using slice
                    let maxP = Math.floor(MAX_SECONDS * downsampledFS);
                    if (tArray.length > maxP) {
                        tArray = tArray.slice(-maxP);
                        ai0Array = ai0Array.slice(-maxP);
                        ai1Array = ai1Array.slice(-maxP);
                        ao0Array = ao0Array.slice(-maxP);
                        previewArray = previewArray.slice(-maxP);
                        thresholdArray = thresholdArray.slice(-maxP);
                    }

                    // Plot immediately directly from standard JS arrays
                    uplotAi0.setData([tArray, ai0Array]);
                    uplotAi1.setData([tArray, ai1Array]);
                    uplotAo0.setData([tArray, previewArray, thresholdArray, ao0Array]);

                } catch (err) {
                    console.error("RX Err:", err);
                }
            };
        }

        function updateButtonsVisually() {
            let btnCtrl = document.getElementById('btn-ctrl');
            let btnLoop = document.getElementById('btn-loop');
            let btnRec = document.getElementById('btn-rec');
            let btnAcq = document.getElementById('btn-acq');
            let btnArm = document.getElementById('btn-arm');
            let stimModeSel = document.getElementById('stim-mode');
            let stimGainSlider = document.getElementById('stim-gain');
            let stimGainLabel = document.getElementById('stim-gain-label');
            let pulseThreshold = document.getElementById('pulse-threshold');
            let pulseThresholdLabel = document.getElementById('pulse-threshold-label');
            let pulseWindow = document.getElementById('pulse-window');
            let pulseWindowLabel = document.getElementById('pulse-window-label');
            let cortexChannel = document.getElementById('cortex-channel');
            let recordingFilename = document.getElementById('recording-filename');
            let pulsePolaritySelect = document.getElementById('pulse-polarity');
            let faultPanel = document.getElementById('fault-panel');

            btnCtrl.className = currentMode === 'control' ? 'active mode-ctrl' : '';
            btnLoop.className = currentMode === 'closed-loop' ? 'active mode-loop' : '';

            if (stimModeSel) stimModeSel.value = stimMode;
            if (stimGainSlider) stimGainSlider.value = stimGain;
            if (stimGainLabel) stimGainLabel.textContent = `×${Number(stimGain).toFixed(3)}`;
            if (pulseThreshold) pulseThreshold.value = pulseThresholdStd;
            if (pulseThresholdLabel) pulseThresholdLabel.textContent = `${Number(pulseThresholdStd).toFixed(1)} SD`;
            if (pulseWindow) pulseWindow.value = pulseWindowSec;
            if (pulseWindowLabel) pulseWindowLabel.textContent = `${Number(pulseWindowSec).toFixed(0)} s`;
            if (pulsePolaritySelect) pulsePolaritySelect.value = pulsePolarity;
            if (btnAcq) {
                btnAcq.textContent = isAcquiring ? 'Stop Acquisition' : 'Start Acquisition';
                btnAcq.className = isAcquiring ? 'active rec-on' : '';
            }
            if (btnArm) {
                btnArm.textContent = isArmed ? 'Disarm Output' : 'Arm Output';
                btnArm.className = isArmed ? 'active arm-on' : '';
                btnArm.disabled = !isAcquiring || currentMode !== 'closed-loop' || stimMode === 'off' || stimGain <= 0 || !!currentFault;
            }
            if (faultPanel) {
                faultPanel.style.display = currentFault ? 'block' : 'none';
                faultPanel.textContent = currentFault ? `FAULT — ${currentFault}. Output is latched safe; restart after correcting the cause.` : '';
            }
            if (cortexChannel) {
                cortexChannel.value = cortexAi;
                cortexChannel.disabled = isRecording;
            }
            if (recordingFilename) recordingFilename.disabled = isRecording;

            if (isRecording) {
                btnRec.className = 'active rec-on';
                btnRec.textContent = 'Stop Recording';
            } else {
                btnRec.className = '';
                btnRec.textContent = 'Start Recording';
            }
        }

        function setMode(modeText) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'set_mode', mode: modeText }));
            }
        }

        function toggleRecording() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                let cmd = isRecording ? 'stop_recording' : 'start_recording';
                let payload = { command: cmd };
                if (!isRecording) {
                    payload.filename = document.getElementById('recording-filename').value;
                }
                ws.send(JSON.stringify(payload));
            }
        }

        function setStim(isLive = false) {
            const requestedMode = document.getElementById('stim-mode').value;
            const requestedGain = parseFloat(document.getElementById('stim-gain').value);
            document.getElementById('stim-gain-label').textContent = `×${requestedGain.toFixed(3)}`;
            const send = () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ command: 'set_stim', stim_mode: requestedMode, stim_gain: requestedGain }));
                }
            };
            clearTimeout(stimSendTimer);
            stimSendTimer = isLive ? setTimeout(send, 100) : null;
            if (!isLive) send();
        }

        function toggleAcquisition() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: isAcquiring ? 'stop_acquisition' : 'start_acquisition' }));
            }
        }

        function toggleArmed() {
            if (!isArmed && !window.confirm('Arm the analog output using the selected mode and gain?')) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'set_armed', armed: !isArmed }));
            }
        }

        function setPulsePolarity() {
            const value = document.getElementById('pulse-polarity').value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'set_pulse_polarity', pulse_polarity: value }));
            }
        }

        function setCortexChannel() {
            const requestedChannel = document.getElementById('cortex-channel').value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'set_cortex_channel', channel: requestedChannel }));
            }
        }

        function setPulseThreshold() {
            pulseThresholdStd = parseFloat(document.getElementById('pulse-threshold').value);
            document.getElementById('pulse-threshold-label').textContent = `${pulseThresholdStd.toFixed(1)} SD`;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'set_pulse_threshold', pulse_threshold_std: pulseThresholdStd }));
            }
        }

        function setPulseWindow() {
            pulseWindowSec = parseFloat(document.getElementById('pulse-window').value);
            document.getElementById('pulse-window-label').textContent = `${pulseWindowSec.toFixed(0)} s`;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'set_pulse_window', pulse_window_sec: pulseWindowSec }));
            }
        }

        function stopApplication() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                window.alert("The application is not connected.");
                return;
            }
            if (!window.confirm("Stop acquisition, set output to zero, and close The Echo Chamber?")) {
                return;
            }

            shutdownRequested = true;
            let button = document.getElementById("btn-stop-app");
            button.disabled = true;
            button.textContent = "Stopping…";
            let badge = document.getElementById("status");
            badge.textContent = "STOPPING";
            badge.className = "status-badge disconnected";
            ws.send(JSON.stringify({ command: "shutdown" }));
        }

        // Init App 
        connect();
    </script>
</body>

</html>
